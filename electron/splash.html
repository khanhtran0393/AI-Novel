<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Novel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      background: transparent !important;
      overflow: hidden !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }
    /* Logo only — floats on real desktop through transparent window */
    .logo {
      width: min(220px, 42vw);
      height: min(220px, 42vw);
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent !important;
      filter:
        drop-shadow(0 14px 36px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 28px rgba(245, 158, 11, 0.4));
      animation: soft-float 2.8s ease-in-out infinite;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
      background: transparent;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    @keyframes soft-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
      50% { transform: translateY(-10px) scale(1.03); opacity: 0.97; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-busy="true" aria-label="AI Novel">
    <div class="logo" aria-hidden="true">
      <img src="splash-logo.jpg" alt="" draggable="false" />
    </div>
  </div>
</body>
</html>
