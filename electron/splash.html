<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Novel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      background: transparent !important;
      overflow: hidden !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }
    /* Logo only — floats on desktop; solid plate under PNG (GPU-safe) */
    .logo {
      position: relative;
      width: min(220px, 42vw);
      height: min(220px, 42vw);
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent !important;
      animation: soft-float 2.8s ease-in-out infinite;
    }
    .logo .plate {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3f2a12 0%, #1a1208 55%, #0a0806 100%);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(245, 158, 11, 0.35),
        0 0 36px rgba(245, 158, 11, 0.45);
      z-index: 0;
    }
    .logo img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
      background: transparent;
      opacity: 1;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    @keyframes soft-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
      50% { transform: translateY(-10px) scale(1.03); opacity: 0.97; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-busy="true" aria-label="AI Novel">
    <div class="logo" aria-hidden="true">
      <span class="plate"></span>
      <img src="splash-logo.png" alt="" draggable="false" />
    </div>
  </div>
</body>
</html>
