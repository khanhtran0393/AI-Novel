name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke core
        run: npm run smoke:core

      - name: Verify core (DNA · ship · SEO · criteria)
        run: npm run verify:core

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright contracts + UI + output-criteria
        run: npm run test:e2e
