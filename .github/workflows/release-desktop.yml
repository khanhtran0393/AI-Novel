name: Release signed Windows desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-verify:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: signing
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://azlizrbjkqcyqnsmuccv.supabase.co

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Match tag to package version
        shell: pwsh
        run: |
          if (-not '${{ github.ref }}'.StartsWith('refs/tags/v')) {
            throw 'Production desktop releases require a v* tag.'
          }
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }

      - name: Verify, build and Authenticode-sign NSIS installer
        run: npm run build:desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Audit packaged runtime contents
        run: npm run audit:package -- dist/win-unpacked

      - name: Verify release manifest, hashes and Authenticode
        run: npm run release:artifact:verify
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Install, launch, health-check and uninstall signed package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -File -Filter 'AI-Novel-*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          ./scripts/smoke-installed-desktop.ps1 -InstallerPath $installers[0].FullName -SkipCloudTrial
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Build signed lower-version updater baseline
        run: npx electron-builder --win nsis --publish never --config.directories.output=dist-update-baseline --config.extraMetadata.version=0.0.0
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Audit updater baseline runtime contents
        run: npm run audit:package -- dist-update-baseline/win-unpacked

      - name: Archive verified signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-novel-windows-candidate-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/AI-Novel-*.exe
            dist/AI-Novel-*.exe.blockmap
            dist/latest.yml
            dist/win-unpacked/AI Novel & Script Generator.exe

      - name: Archive signed updater baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-novel-windows-updater-baseline-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: dist-update-baseline/AI-Novel-*.exe

  publish-approved:
    needs: build-sign-verify
    runs-on: windows-latest
    timeout-minutes: 35
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://azlizrbjkqcyqnsmuccv.supabase.co

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified signed release candidate
        uses: actions/download-artifact@v4
        with:
          name: ai-novel-windows-candidate-${{ github.ref_name }}
          path: dist

      - name: Download signed updater baseline
        uses: actions/download-artifact@v4
        with:
          name: ai-novel-windows-updater-baseline-${{ github.ref_name }}
          path: dist-update-baseline

      - name: Re-verify candidate before publication
        run: npm run release:artifact:verify
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Exercise real cloud Trial and paid Pro on the installed candidate
        shell: pwsh
        run: |
          $hwid = (& npx tsx -e "import { getHwid } from './src/lib/entitlement.ts'; console.log(getHwid())").Trim()
          if ($hwid -notmatch '^[a-f0-9]{16}$') {
            throw "Could not resolve release-runner HWID: $hwid"
          }
          "QA_TRIAL_HWID=$hwid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ([string]::IsNullOrWhiteSpace($env:AINOVEL_ENTITLEMENT_ADMIN_KEY)) {
            throw 'AINOVEL_ENTITLEMENT_ADMIN_KEY is required for paid Pro release smoke'
          }
          $issueBody = @{
            hwid = $hwid
            planId = 'month'
            issueMode = 'token'
            adminKey = $env:AINOVEL_ENTITLEMENT_ADMIN_KEY
          } | ConvertTo-Json -Compress
          $issuedPro = Invoke-RestMethod `
            -Method POST `
            -Uri "$env:AINOVEL_LICENSE_API_URL/api/cloud/license/issue" `
            -ContentType 'application/json' `
            -Body $issueBody `
            -TimeoutSec 30
          if (
            $issuedPro.ok -ne $true -or
            [string]::IsNullOrWhiteSpace([string]$issuedPro.token) -or
            [string]::IsNullOrWhiteSpace([string]$issuedPro.licenseId) -or
            $issuedPro.plan -ne 'pro' -or
            $issuedPro.cloud -ne $true
          ) {
            throw 'Production license API did not persist a paid Pro QA license'
          }
          "QA_PRO_LICENSE_ID=$($issuedPro.licenseId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installers = @(Get-ChildItem -LiteralPath dist -File -Filter 'AI-Novel-*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          ./scripts/smoke-installed-desktop.ps1 `
            -InstallerPath $installers[0].FullName `
            -PaidProToken ([string]$issuedPro.token) `
            -PaidProLicenseId ([string]$issuedPro.licenseId)
        env:
          AINOVEL_LICENSE_API_URL: https://ai-novel-flax.vercel.app
          AINOVEL_ENTITLEMENT_ADMIN_KEY: ${{ secrets.AINOVEL_ENTITLEMENT_ADMIN_KEY }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Remove release-runner cloud Trial data
        if: always() && env.QA_TRIAL_HWID != ''
        run: node scripts/cleanup-release-qa-trial.mjs --hwid ${{ env.QA_TRIAL_HWID }} --confirm-release-qa
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Remove exact release-runner cloud Pro QA row
        if: always() && env.QA_TRIAL_HWID != '' && env.QA_PRO_LICENSE_ID != ''
        run: node scripts/cleanup-release-qa-pro.mjs --hwid ${{ env.QA_TRIAL_HWID }} --license-id ${{ env.QA_PRO_LICENSE_ID }} --confirm-release-qa
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Stage signed candidate on a disposable HTTPS feed
        shell: pwsh
        run: |
          $bucket = 'desktop-updates-qa-${{ github.run_id }}-${{ github.run_attempt }}'
          node scripts/publish-desktop-update.mjs --provision --bucket $bucket
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-desktop-update.mjs --publish --dir dist --bucket $bucket
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Download, signature-check, install and launch the real update
        shell: pwsh
        run: |
          $baselines = @(Get-ChildItem -LiteralPath dist-update-baseline -File -Filter 'AI-Novel-*.exe')
          if ($baselines.Count -ne 1) {
            throw "Expected exactly one updater baseline, found $($baselines.Count)"
          }
          $bucket = 'desktop-updates-qa-${{ github.run_id }}-${{ github.run_attempt }}'
          $feed = "https://azlizrbjkqcyqnsmuccv.supabase.co/storage/v1/object/public/$bucket/latest"
          ./scripts/smoke-desktop-update.ps1 `
            -BaselineInstallerPath $baselines[0].FullName `
            -CandidateExePath 'dist/win-unpacked/AI Novel & Script Generator.exe' `
            -UpdateFeedUrl $feed
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}

      - name: Remove disposable updater feed
        if: always()
        shell: pwsh
        run: |
          $bucket = 'desktop-updates-qa-${{ github.run_id }}-${{ github.run_attempt }}'
          node scripts/publish-desktop-update.mjs --cleanup-bucket --bucket $bucket
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish signed immutable update feed
        run: npm run release:publish
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
          WIN_CSC_CERTIFICATE_SHA1: ${{ vars.WIN_CSC_CERTIFICATE_SHA1 }}
