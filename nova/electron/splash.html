<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; color: #f4f4f5; font-family: "Segoe UI", system-ui, sans-serif; background: transparent; }
  .splash { display: flex; flex-direction: column; align-items: center; gap: 10px; background: transparent; }
  .logo { width: 660px; max-width: 84vw; height: auto; object-fit: contain; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 8px 22px rgba(0,0,0,.5)); }
  .name { font-size: 16px; font-weight: 800; letter-spacing: .02em; color: #f4f4f5; text-shadow: 0 1px 10px rgba(0,0,0,.65); }
  .loading { display: flex; align-items: center; gap: 9px; margin-top: 4px; color: #d4d4d8; font-size: 11px; }
  .track { width: 150px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.18); }
  .track::before { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f59e0b, #ff7b00); animation: progress 1.25s ease-in-out infinite; }
  @keyframes progress { 0% { transform: translateX(-160%); } 100% { transform: translateX(390%); } }
  @media (prefers-reduced-motion: reduce) { .track::before { animation: none; } }
</style>
</head>
<body>
  <main class="splash" aria-label="AI Video Studio đang khởi động" aria-busy="true">
    <img class="logo" src="../assets/logo.png" alt="AI Video Studio" onerror="this.style.display='none'">
    <div class="name">AI Video Studio</div>
    <div class="loading"><span>Đang khởi động studio…</span><span class="track" aria-hidden="true"></span></div>
  </main>
</body>
</html>
